name: barnasht_app
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.3+4

environment:
  sdk: ^3.13.1

dependencies:
  cloud_firestore: ^6.9.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.1.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  geocoding: ^4.0.0
  geolocator: ^14.0.3
  get_it: ^9.2.1
  google_maps_flutter: ^2.18.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  modal_progress_hud_nsn: ^0.5.1
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  string_similarity: ^2.2.0
  svg_flutter: ^0.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml
  
  fonts:
    - family: 'IBMPlexSansArabic'
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Thin.ttf
          weight: 100

        - asset: assets/fonts/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300

        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400

        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500

        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils
  filename: app_images.dart
  field_prefix: null
flutter_intl:
  enabled: true
